[package]
name = "meso-calcul"
version = "1.2.0"
description = "메소노믹스 설치판 (Windows · Android)"
edition = "2021"
publish = false

[lib]
# 모바일(Android)은 라이브러리로, Windows 는 main.rs 가 이걸 부른다
name = "meso_calcul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

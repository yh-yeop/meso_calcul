<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>메소 계산기</title>
<meta name="robots" content="noindex">
<script>
  // 장부는 메인 화면의 탭으로 합쳐짐. 예전 주소(#stats · #budget 포함)는 그 탭으로 보냄
  var h = location.hash.replace(/^#/, "");
  location.replace("index.html#ledger" + (h === "stats" || h === "budget" ? "/" + h : ""));
</script>
<meta http-equiv="refresh" content="0; url=index.html#ledger">
</head>
<body><a href="index.html#ledger">메소 장부로 이동</a></body>
</html>

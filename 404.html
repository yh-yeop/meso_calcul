<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>페이지를 찾을 수 없음 — 메소노믹스</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111112">
<link rel="icon" href="/meso_calcul/icon.svg" type="image/svg+xml">
<script>
  try{ var t = localStorage.getItem("meso-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch(e){}
</script>
<!-- 하위 경로에서도 열리므로 절대 경로로 -->
<link rel="stylesheet" href="/meso_calcul/app.css">
<style>
  .nf{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
  .nf img{width:72px;height:72px}
  .nf h1{font-size:20px}
  .nf p{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="app nf">
  <img src="/meso_calcul/icon.svg" alt="">
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없는 페이지입니다.</p>
  <a class="btn primary" href="/meso_calcul/">메소노믹스로 가기</a>
</div>
</body>
</html>
